name: Build and publish to Github pages

on:
  push:
    branches: [ "main" ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v4
      with:
        go-version: '1.22'

    - name: Build
      run: |
        mkdir public
        cp ./web/* ./public/ -rf
        GOOS=js GOARCH=wasm go build -o ./public/main.wasm ./wasm/wasm_main.go
        cp "$(go env GOROOT)/misc/wasm/wasm_exec.js" ./public/

    - name: Deploy
      uses: peaceiris/actions-gh-pages@v4
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_dir: ./public
        publish_branch: gh-pages
        force_orphan: true
